[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sharp-root-anticoncentration"
version = "0.1.0"
description = "Reproducibility artifact for sharp root anti-concentration and graph-learning applications"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "Zijun Wang"},
  {name = "Yuchen Miao"},
]
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
]

[project.urls]
Repository = "https://github.com/sgzizi/sharp-root-anticoncentration"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
