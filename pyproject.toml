[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sharp-root-anticoncentration"
version = "0.1.0"
description = "Reproducibility artifact for sharp root anti-concentration and graph-learning applications"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "Zijun Wang", email = "wangzj@mails.neu.edu.cn"},
  {name = "Yuchen Miao", email = "miaoyc@mails.neu.edu.cn"},
  {name = "Yifan Hu", email = "23251317@bjtu.edu.cn"},
  {name = "Huanmin Liu", email = "202305133221@smail.xtu.edu.cn"},
]
keywords = [
  "anti-concentration",
  "online learning",
  "random polynomials",
  "graph learning",
  "reproducible research",
]
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
]

[project.urls]
Repository = "https://github.com/sgzizi/sharp-root-anticoncentration"
Issues = "https://github.com/sgzizi/sharp-root-anticoncentration/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
# Maintenance annotation; functional content is unchanged.
