name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - name: Smoke-test all reproduction scripts
        run: |
          python experiments/dimension_free.py --samples 1000 --figures-dir /tmp/figures --results-dir /tmp/results
          python experiments/rbf_graph_ssl.py --horizons 4,8 --repetitions 1 --dense-points 21 --n 8 --labeled 2 --figures-dir /tmp/figures/rbf --results-dir /tmp/results/rbf
          python experiments/common_offset_demo.py --samples 1000 --figures-dir /tmp/figures --results-dir /tmp/results/common
# Maintenance annotation; functional content is unchanged.
